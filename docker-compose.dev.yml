# Local development: Postgres + API gateway nginx shim.
# Run NestJS services on the host (npm run start:dev) or add them to this file later.

services:
  gateway:
    image: nginx:1.27-alpine
    container_name: vehicle_marketplace_gateway
    ports:
      - "8080:8080"
    volumes:
      - ./api-gateway/local/nginx.conf:/etc/nginx/nginx.conf:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
