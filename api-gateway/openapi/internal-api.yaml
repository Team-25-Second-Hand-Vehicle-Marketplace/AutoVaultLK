openapi: 3.0.3
info:
  title: AutoVaultLK Internal API (East-West)
  description: |
    Service-to-service routes per SAD section 3.5.2 and ADR-005.
    Not exposed to browsers. Protected by INTERNAL_SERVICE_KEY or service JWT.

    ETL listing persistence (FR-14) is not on this API. Per ADR-002, the
    ingestion Load stage writes directly to marketplace.vehicles via
    MarketplaceVehiclesWriteAdapter (parameterized SQL + ON CONFLICT upsert).
    A future event-driven boundary (SQS consumer / internal bulk HTTP API) was
    evaluated and deferred — revisit only if independent scaling is required.
  version: 1.0.0

servers:
  - url: https://{apiId}.execute-api.{region}.amazonaws.com/{stage}
    description: Private AWS API Gateway (VPC)
    variables:
      apiId:
        default: internal-example
      region:
        default: ap-southeast-1
      stage:
        default: dev
tags:
  - name: internal-auth
  - name: internal-notifications

paths:
  /internal/dealers/{id}/approve:
    post:
      tags: [internal-auth]
      summary: Approve dealer verification (admin-service -> auth-user-service)
      operationId: approveDealer
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Dealer approved

  /internal/dealers/{id}/reject:
    post:
      tags: [internal-auth]
      summary: Reject dealer verification
      operationId: rejectDealer
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Dealer rejected

  /internal/users/{id}/deactivate:
    post:
      tags: [internal-auth]
      summary: Deactivate user account (admin-service -> auth-user-service)
      operationId: deactivateUser
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [adminId]
              properties:
                adminId:
                  type: string
                  format: uuid
      responses:
        '200':
          description: User deactivated
        '403':
          description: Administrator cannot deactivate their own account

  /notifications/events:
    post:
      tags: [internal-notifications]
      summary: Enqueue a templated notification event (FR-49–FR-53)
      operationId: createNotificationEvent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, userId, idempotencyKey]
              properties:
                type:
                  type: string
                  enum: [UPLOAD_COMPLETED, UPLOAD_FAILED, DEALER_VERIFIED, DEALER_REJECTED]
                userId:
                  type: string
                  format: uuid
                idempotencyKey:
                  type: string
                payload:
                  type: object
      responses:
        '202':
          description: Notification event accepted for asynchronous processing
        '401':
          description: Missing or invalid X-Internal-Service-Key
        '503':
          description: Notification queue is unavailable or not configured

components:
  securitySchemes:
    serviceKey:
      type: apiKey
      in: header
      name: X-Internal-Service-Key
