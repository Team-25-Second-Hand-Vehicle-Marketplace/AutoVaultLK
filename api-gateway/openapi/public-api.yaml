openapi: 3.0.3
info:
  title: AutoVault LK Public API
  description: |
    North-south routes per SAD section 3.5.1.
    JWT validation is performed by each NestJS service, not at the gateway.
  version: 1.0.0

servers:
  - url: https://{apiId}.execute-api.{region}.amazonaws.com/{stage}
    description: AWS API Gateway (production)
    variables:
      apiId:
        default: example
      region:
        default: ap-southeast-1
      stage:
        default: dev
  - url: http://localhost:8080
    description: Local nginx path proxy (development)

tags:
  - name: auth
  - name: marketplace
  - name: ingest
  - name: jobs
  - name: admin

paths:
  /auth/register/buyer:
    post:
      tags: [auth]
      summary: Register buyer (public)
      operationId: registerBuyer
      responses:
        '201':
          description: Created

  /auth/register/dealer:
    post:
      tags: [auth]
      summary: Register dealer (public)
      description: |
        Creates a pending dealer account (FR-02). No JWT is returned —
        dealers authenticate via POST /auth/login after administrator approval (FR-03).
      operationId: registerDealer
      responses:
        '201':
          description: Registration accepted; awaiting admin verification

  /auth/login:
    post:
      tags: [auth]
      summary: Login (public)
      operationId: login
      responses:
        '200':
          description: Token pair issued

  /auth/login/admin:
    post:
      tags: [auth]
      summary: Admin login (public)
      operationId: loginAdmin
      responses:
        '200':
          description: Token pair issued

  /auth/refresh:
    post:
      tags: [auth]
      summary: Refresh access token (public)
      operationId: refreshToken
      responses:
        '200':
          description: New access token

  /auth/logout:
    post:
      tags: [auth]
      summary: Revoke refresh token
      operationId: logout
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Logged out

  /marketplace/listings:
    get:
      tags: [marketplace]
      summary: Browse listings (public — LIVE only)
      operationId: listListings
      responses:
        '200':
          description: Paginated listings
    post:
      tags: [marketplace]
      summary: Create listing (dealer)
      operationId: createListing
      security:
        - bearerAuth: []
      responses:
        '201':
          description: Created

  /marketplace/listings/{id}:
    get:
      tags: [marketplace]
      summary: Get listing by id (public if LIVE)
      operationId: getListing
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Listing detail
    patch:
      tags: [marketplace]
      summary: Update listing (dealer)
      operationId: updateListing
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Updated

  /marketplace/dealers/{id}/profile:
    get:
      tags: [marketplace]
      summary: Dealer profile summary alongside listings
      operationId: getDealerProfile
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Dealer profile

  /ingest/upload:
    post:
      tags: [ingest]
      summary: Bulk upload intake (business dealer, verified)
      operationId: ingestUpload
      security:
        - bearerAuth: []
      responses:
        '202':
          description: Accepted with jobId

  /jobs/{jobId}:
    get:
      tags: [jobs]
      summary: Poll upload job status
      operationId: getJobStatus
      security:
        - bearerAuth: []
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Job status

  /admin/dashboard:
    get:
      tags: [admin]
      summary: Administrator dashboard aggregates
      operationId: adminDashboard
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Dashboard metrics

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    JobAccepted:
      type: object
      properties:
        jobId:
          type: string
          format: uuid

x-amazon-apigateway-cors:
  allowOrigins:
    - http://localhost:5173
  allowMethods:
    - GET
    - POST
    - PUT
    - PATCH
    - DELETE
    - OPTIONS
  allowHeaders:
    - Authorization
    - Content-Type
