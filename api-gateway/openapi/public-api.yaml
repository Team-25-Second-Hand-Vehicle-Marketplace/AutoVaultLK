openapi: 3.0.3
info:
  title: AutoVaultLK Public API
  description: |
    North-south routes per SAD section 3.5.1.
    JWT validation is performed by each NestJS service, not at the gateway.
  version: 1.0.0
servers:
  - url: https://{apiId}.execute-api.{region}.amazonaws.com/{stage}
    description: AWS API Gateway (production)
    variables:
      apiId:
        default: example
      region:
        default: ap-southeast-1
      stage:
        default: dev
  - url: http://localhost:8080
    description: Local nginx path proxy (development)
tags:
  - name: auth
  - name: marketplace
  - name: ingest
  - name: jobs
  - name: admin
paths:
  /auth/register/buyer:
    post:
      tags:
        - auth
      summary: Register buyer (public)
      operationId: registerBuyer
      responses:
        '201':
          description: Created
  /auth/register/dealer:
    post:
      tags:
        - auth
      summary: Register dealer (public)
      description: |
        Creates a pending dealer account (FR-02). No JWT is returned —
        dealers authenticate via POST /auth/login after administrator approval (FR-03).
      operationId: registerDealer
      responses:
        '201':
          description: Registration accepted; awaiting admin verification

  /auth/login:
    post:
      tags:
        - auth
      summary: Login (public)
      operationId: login
      responses:
        '200':
          description: Token pair issued
  /auth/login/admin:
    post:
      tags:
        - auth
      summary: Admin login (public)
      operationId: loginAdmin
      responses:
        '200':
          description: Token pair issued
  /auth/refresh:
    post:
      tags:
        - auth
      summary: Refresh access token (public)
      operationId: refreshToken
      responses:
        '200':
          description: New access token
  /auth/logout:
    post:
      tags:
        - auth
      summary: Revoke refresh token
      operationId: logout
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Logged out
  /marketplace/listings:
    get:
      tags:
        - marketplace
      summary: Browse listings (public — LIVE only)
      operationId: listListings
      responses:
        '200':
          description: Paginated listings
    post:
      tags:
        - marketplace
      summary: Create listing (dealer)
      operationId: createListing
      security:
        - bearerAuth: []
      responses:
        '201':
          description: Created
  /marketplace/listings/{id}:
    get:
      tags:
        - marketplace
      summary: Get listing by id (public if LIVE)
      operationId: getListing
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Listing detail
    patch:
      tags:
        - marketplace
      summary: Update listing (dealer)
      operationId: updateListing
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Updated
  /marketplace/dealers/{id}/profile:
    get:
      tags:
        - marketplace
      summary: Dealer profile summary alongside listings
      operationId: getDealerProfile
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Dealer profile

  /marketplace/search/filters:
    get:
      tags:
        - marketplace
      summary: Filter-based search over LIVE listings (public — guest browsing)
      operationId: filterSearch
      parameters:
        - name: vehicleType
          in: query
          schema:
            type: string
          description: Comma-separated, e.g. CAR,SUV
        - name: make
          in: query
          schema:
            type: string
        - name: model
          in: query
          schema:
            type: string
        - name: fuelType
          in: query
          schema:
            type: string
        - name: transmissionType
          in: query
          schema:
            type: string
        - name: minPrice
          in: query
          schema:
            type: integer
        - name: maxPrice
          in: query
          schema:
            type: integer
        - name: minYear
          in: query
          schema:
            type: integer
        - name: maxYear
          in: query
          schema:
            type: integer
        - name: minMileage
          in: query
          schema:
            type: integer
        - name: maxMileage
          in: query
          schema:
            type: integer
        - name: verifiedDealersOnly
          in: query
          schema:
            type: boolean
        - name: hasRegistrationYear
          in: query
          schema:
            type: boolean
        - name: q
          in: query
          schema:
            type: string
          description: Keyword match against the tsvector search_vector column
        - name: sort
          in: query
          schema:
            type: string
            enum: [relevance, price_asc, price_desc, year_desc, mileage_asc, newest]
        - name: page
          in: query
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
        - name: facets
          in: query
          schema:
            type: boolean
      responses:
        '200':
          description: Paginated, filtered listings
  /marketplace/search/nl:
    get:
      tags:
        - marketplace
      summary: Natural-language search over LIVE listings (public — guest browsing)
      description: |
        Deterministic parser (FR-21) turns `q` into structured filters. When
        parse confidence is below 0.6, unresolved tokens are sent to Groq
        and whitelist-validated (FR-21.2 / FR-21.3) before merging. Groq
        outages fall back to rules-only filters. Leftover semantic text is
        embedded with all-MiniLM-L6-v2 and ranked with
        `ORDER BY embedding <=> query_vector` (FR-22 / FR-23). If MiniLM is
        unavailable, leftovers are ranked with pg_trgm `word_similarity` on
        `search_text` (FR-24); a `search_text` WHERE is applied only when
        the parser extracted no filters. Resolved make/model are never
        re-matched via trigram.
      operationId: nlSearch
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            maxLength: 500
          description: Free-text query, e.g. "Toyata Corrola under 8.5m deisel"
        - name: sort
          in: query
          schema:
            type: string
            enum: [relevance, price_asc, price_desc, year_desc, mileage_asc, newest]
        - name: page
          in: query
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
        - name: facets
          in: query
          schema:
            type: boolean
      responses:
        '200':
          description: Paginated listings plus parse metadata (confidence, unresolved tokens)
  /marketplace/search/facets:
    get:
      tags:
        - marketplace
      summary: Standalone facet counts for the search sidebar (public)
      operationId: searchFacets
      responses:
        '200':
          description: Per-dimension facet counts
  /marketplace/search/options:
    get:
      tags:
        - marketplace
      summary: Dropdown option values — enums plus make/model dictionary (public)
      operationId: searchOptions
      parameters:
        - name: vehicleType
          in: query
          schema:
            type: string
          description: Scopes the make/model list to this vehicle type
      responses:
        '200':
          description: Vehicle types, conditions, fuel/transmission enums, body types, makes with nested models



  /ingest/upload:
    post:
      tags:
        - ingest
      summary: Bulk upload intake (business dealer, verified)
      description: >
        Accepts a dealer inventory CSV and an optional ZIP of vehicle photos,
        stores both, creates an upload job and returns immediately. The ETL
        pipeline runs asynchronously; poll GET /jobs/{jobId} for progress.


        Two conditions gate this endpoint, not one: the caller must hold the
        DEALER role *and* be a verified business dealer.
      operationId: ingestUpload
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - csv
              properties:
                csv:
                  type: string
                  format: binary
                  description: >
                    Inventory CSV, UTF-8, max 25 MB. Required columns are make,
                    model, year, price and mileage; registration_number is
                    optional but is what photos are matched on. Common header
                    spellings are folded automatically.
                zip:
                  type: string
                  format: binary
                  description: >
                    Optional archive of photos named after each vehicle's
                    registration number, e.g. CAB-1234_1.jpg. Max 250 MB.
            encoding:
              csv:
                contentType: text/csv
              zip:
                contentType: application/zip
      responses:
        '202':
          description: >
            Upload accepted and queued. The job has not run yet — its status is
            PENDING until the pipeline starts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobAccepted'
        '400':
          description: >
            Missing or empty CSV, a non-CSV extension, an unrecognised MIME
            type, or a form field other than `csv` and `zip`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: No or invalid bearer token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: >
            The caller is not a DEALER, or is a dealer who is not a verified
            business dealer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: >
            Body exceeds the gateway limit. nginx sets client_max_body_size on
            this location; a file past the service's own 25 MB CSV cap returns
            400 instead, because it reaches the handler.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /jobs/{jobId}:
    get:
      tags:
        - jobs
      summary: Poll upload job status
      operationId: getJobStatus
      security:
        - bearerAuth: []
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Job status and row counts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobStatus'
        '400':
          description: jobId is not a UUID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: No or invalid bearer token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: >
            No such job, or the job belongs to another dealer. Deliberately not
            403: that would confirm the id exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /admin/dashboard:
    get:
      tags:
        - admin
      summary: Administrator dashboard aggregates (FR-48)
      operationId: adminDashboard
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Dashboard metrics (LIVE listings, users, uploads, notification rates, recent audit)
        '403':
          description: Non-administrator JWT
  /admin/users:
    get:
      tags:
        - admin
      summary: List users and dealer verification state
      operationId: adminListUsers
      security:
        - bearerAuth: []
      parameters:
        - name: verificationStatus
          in: query
          schema:
            type: string
            enum: [PENDING, VERIFIED, REJECTED]
      responses:
        '200':
          description: Users with optional dealer profile
        '403':
          description: Non-administrator JWT
    post:
      tags:
        - admin
      summary: Provision a new administrator (FR-12)
      description: >-
        FR-12 forbids public registration for the ADMIN role. Administrators
        come from the database seed or from an existing administrator; this is
        the latter path.
      operationId: adminCreateAdministrator
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, name, password]
              properties:
                email:
                  type: string
                  format: email
                  maxLength: 255
                name:
                  type: string
                  maxLength: 255
                password:
                  type: string
                  minLength: 8
                  maxLength: 128
                  description: >-
                    Must satisfy FR-06: mixed case and a number.
      responses:
        '201':
          description: Administrator created; audit row written
        '400':
          description: Validation failed
        '403':
          description: Non-administrator JWT
        '409':
          description: Email already registered
  /admin/uploads:
    get:
      tags:
        - admin
      summary: View upload jobs across all dealers (FR-44)
      operationId: adminListUploads
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [PENDING, PROCESSING, COMPLETED, FAILED, PARTIAL]
      responses:
        '200':
          description: Upload jobs
        '403':
          description: Non-administrator JWT
  /admin/reports:
    get:
      tags:
        - admin
      summary: Summary reports over a date range (FR-45)
      operationId: adminReports
      security:
        - bearerAuth: []
      parameters:
        - name: from
          in: query
          required: true
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: true
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: Listing counts, upload volumes, error/partial rates, active users
        '400':
          description: Invalid date range
        '403':
          description: Non-administrator JWT
  /admin/audit-logs:
    get:
      tags:
        - admin
      summary: Search administrative audit logs (FR-46, FR-47)
      operationId: adminAuditLogs
      security:
        - bearerAuth: []
      parameters:
        - name: action
          in: query
          schema:
            type: string
        - name: entityType
          in: query
          schema:
            type: string
        - name: actorId
          in: query
          schema:
            type: string
            format: uuid
        - name: from
          in: query
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: Audit log rows
        '403':
          description: Non-administrator JWT
  /admin/dealers/{id}/approve:
    post:
      tags:
        - admin
      summary: Approve a pending dealer (Auth HTTP + audit + DEALER_VERIFIED)
      operationId: adminApproveDealer
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Dealer approved; audit row written
        '403':
          description: Non-administrator JWT
  /admin/dealers/{id}/reject:
    post:
      tags:
        - admin
      summary: Reject a pending dealer (Auth HTTP + audit + DEALER_REJECTED)
      operationId: adminRejectDealer
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  minLength: 3
                  maxLength: 500
                  description: >-
                    Stored on the dealer profile and included in the rejection
                    email (FR-09). Optional, but a rejection without one tells
                    the dealer nothing about what to fix.
      responses:
        '200':
          description: Dealer rejected; audit row written
        '403':
          description: Non-administrator JWT
  /admin/users/{id}/deactivate:
    post:
      tags:
        - admin
      summary: Deactivate a user via Auth internal API and write audit_logs
      operationId: adminDeactivateUser
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: User deactivated; audit row written
        '403':
          description: Non-administrator JWT or self-deactivation
  /admin/users/{id}/reactivate:
    post:
      tags:
        - admin
      summary: Restore a deactivated user via Auth internal API and write audit_logs
      operationId: adminReactivateUser
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: User reactivated; audit row written
        '403':
          description: Non-administrator JWT or self-reactivation
        '404':
          description: User or acting administrator not found
  /admin/dealers/{id}:
    get:
      tags:
        - admin
      summary: Full dealer record for verification review (FR-02.1/FR-02.2)
      description: >-
        Returns the business registration number and uploaded verification
        documents an administrator needs before approving or rejecting, plus
        the linked user account and who decided previously.
      operationId: adminGetDealer
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Dealer profile with verification evidence
        '403':
          description: Non-administrator JWT
        '404':
          description: No dealer profile for that user
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    UploadJobStatus:
      type: string
      description: >
        PARTIAL is a success, not a failure: some rows were rejected with
        reasons and the rest loaded. FAILED means nothing loaded at all.
      enum:
        - PENDING
        - PROCESSING
        - COMPLETED
        - PARTIAL
        - FAILED
    JobAccepted:
      type: object
      required:
        - jobId
        - status
        - fileName
      properties:
        jobId:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/UploadJobStatus'
        fileName:
          type: string
          example: stock.csv
        csvS3Path:
          type: string
          description: Object-store key of the stored CSV.
          example: raw/9a8b7c6d-5e4f-4a3b-9c8d-7e6f5a4b3c2d/stock.csv
        zipS3Path:
          type: string
          nullable: true
          description: Object-store key of the photo archive, null if none was sent.
    JobStatus:
      type: object
      required:
        - id
        - status
        - fileName
        - totalRecords
        - validRecords
        - invalidRecords
      properties:
        id:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/UploadJobStatus'
        fileName:
          type: string
        totalRecords:
          type: integer
          description: >
            Rows in the file, written before fan-out. Legitimately 0 while the
            job is still being split.
          example: 40
        validRecords:
          type: integer
          description: Rows loaded as listings.
          example: 34
        invalidRecords:
          type: integer
          description: Rows rejected, each with a reason recorded against the job.
          example: 6
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    Error:
      type: object
      properties:
        statusCode:
          type: integer
        message:
          oneOf:
            - type: string
            - type: array
              items:
                type: string
          description: >
            An array when the global ValidationPipe rejects a request, a string
            otherwise.
        error:
          type: string
x-amazon-apigateway-cors:
  allowOrigins:
    - http://localhost:5173
  allowMethods:
    - GET
    - POST
    - PUT
    - PATCH
    - DELETE
    - OPTIONS
  allowHeaders:
    - Authorization
    - Content-Type
    - X-CSRF-Token
    - X-Device-Label
    - X-Request-ID
  allowCredentials: true
