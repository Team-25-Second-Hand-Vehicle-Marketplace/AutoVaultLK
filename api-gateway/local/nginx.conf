worker_processes 1;

events {
  worker_connections 1024;
}

http {
  # Local development shim matching SAD section 3.5.1 path prefixes.
  # Services run on the host (npm run start:dev) or in docker-compose.dev.yml.
  # JWT/RBAC is enforced by NestJS services, not nginx.

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  upstream auth_user_service {
    server host.docker.internal:3001;
  }

  upstream marketplace_service {
    server host.docker.internal:3002;
  }

  upstream ingestion_service {
    server host.docker.internal:3003;
  }

  upstream admin_service {
    server host.docker.internal:3004;
  }

  upstream notification_service {
    server host.docker.internal:3005;
  }

  server {
    listen 8080;
    server_name localhost;

    client_max_body_size 100k;

    add_header X-Gateway vehicle-marketplace-api-gateway always;
    add_header X-Gateway-Version v1.0 always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # CORS for local frontend (services also enable CORS when hit directly)
    add_header Access-Control-Allow-Origin http://localhost:5173 always;
    add_header Access-Control-Allow-Credentials true always;
    add_header Access-Control-Allow-Headers "Authorization,Content-Type,X-CSRF-Token,X-Device-Label,X-Request-ID" always;
    add_header Access-Control-Allow-Methods "GET,POST,PUT,PATCH,DELETE,OPTIONS" always;

    if ($request_method = OPTIONS) {
      return 204;
    }

    location /auth/ {
      proxy_pass http://auth_user_service/auth/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Request-ID $request_id;
    }

    # auth-user-service controllers: @Controller('users')
    location /users/ {
      proxy_pass http://auth_user_service/users/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Request-ID $request_id;
    }

    # auth-user-service controllers: @Controller('dealer-profiles')
    location /dealer-profiles/ {
      proxy_pass http://auth_user_service/dealer-profiles/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Request-ID $request_id;
    }

    location /marketplace/ {
      proxy_pass http://marketplace_service/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Request-ID $request_id;
    }

    location /ingest/ {
      proxy_pass http://ingestion_service/ingest/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Request-ID $request_id;
    }

    location /jobs/ {
      proxy_pass http://ingestion_service/jobs/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Request-ID $request_id;
    }

    location /admin/ {
      proxy_pass http://admin_service/admin/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Request-ID $request_id;
    }

    location /notifications/ {
      proxy_pass http://notification_service/notifications/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Request-ID $request_id;
    }

    location = /health {
      default_type application/json;
      return 200 '{"status":"ok","gateway":"local-nginx"}';
    }
  }
}
