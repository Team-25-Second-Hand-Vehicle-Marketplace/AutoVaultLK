worker_processes 1;

events {
  worker_connections 1024;
}

http {
  # Local development shim matching SAD section 3.5.1 path prefixes.
  # Services run on the host (npm run start:dev) or in docker-compose.dev.yml.
  # JWT/RBAC is enforced by NestJS services, not nginx.

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  upstream auth_user_service {
    server host.docker.internal:3001;
  }

  upstream marketplace_service {
    server host.docker.internal:3002;
  }

  upstream ingestion_service {
    server host.docker.internal:3003;
  }

  upstream admin_service {
    server host.docker.internal:3004;
  }

  upstream notification_service {
    server host.docker.internal:3005;
  }

  server {
    listen 8080;
    server_name localhost;

    client_max_body_size 100k;

    add_header X-Gateway vehicle-marketplace-api-gateway always;
    add_header X-Gateway-Version v1.0 always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # BEGIN CORS (generated from config/cors.json - run: npm run sync:cors)
    add_header Access-Control-Allow-Origin http://localhost:5173 always;
    add_header Access-Control-Allow-Credentials true always;
    add_header Access-Control-Allow-Headers "Authorization,Content-Type,X-CSRF-Token,X-Device-Label,X-Request-ID" always;
    add_header Access-Control-Allow-Methods "GET,POST,PUT,PATCH,DELETE,OPTIONS" always;
    # END CORS

    if ($request_method = OPTIONS) {
      return 204;
    }

    location /auth/ {
      proxy_pass http://auth_user_service/auth/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Request-ID $request_id;
    }

    # auth-user-service controllers: @Controller('users')
    location /users/ {
      proxy_pass http://auth_user_service/users/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Request-ID $request_id;
    }

    # auth-user-service controllers: @Controller('dealer-profiles')
    location /dealer-profiles/ {
      proxy_pass http://auth_user_service/dealer-profiles/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Request-ID $request_id;
    }

    # auth-user-service controllers: @Controller('documents') /
    # @Controller('documents/local') - verification-document upload during
    # dealer registration. Overrides the server-wide 100k cap: DocumentUploadService
    # enforces its own 5MB ceiling, so this just needs to not reject a valid
    # upload before it gets there.
    location /documents/ {
      client_max_body_size 5m;

      proxy_pass http://auth_user_service/documents/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Request-ID $request_id;
    }

    location /marketplace/ {
      proxy_pass http://marketplace_service/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Request-ID $request_id;
    }

    location /ingest/ {
      # Overrides the server-wide 100k cap: this is the one endpoint that
      # takes a bulk CSV plus an optional image ZIP. The service enforces its
      # own limits and returns a useful message (CSV: INGESTION_MAX_UPLOAD_MB,
      # 25 MB; ZIP: 250 MB, ingestion-upload.service.ts) - nginx rejects with
      # a bare 413, so this must sit ABOVE their sum or a ZIP between 25 and
      # 250 MB never reaches the service that would have accepted it.
      # 300m = 25 CSV + 250 ZIP + multipart overhead.
      client_max_body_size 300m;
      # A 250 MB body takes longer than nginx's 60s defaults to stream through.
      client_body_timeout 300s;
      proxy_send_timeout 300s;
      proxy_read_timeout 300s;

      proxy_pass http://ingestion_service/ingest/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Request-ID $request_id;
    }

    location /jobs/ {
      proxy_pass http://ingestion_service/jobs/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Request-ID $request_id;
    }

    location /admin/ {
      proxy_pass http://admin_service/admin/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Request-ID $request_id;
    }

    location /notifications/ {
      proxy_pass http://notification_service/notifications/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Request-ID $request_id;
    }

    location = /health {
      default_type application/json;
      return 200 '{"status":"ok","gateway":"local-nginx"}';
    }
  }
}
