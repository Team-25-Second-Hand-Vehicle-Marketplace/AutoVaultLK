name: Load Test - End to End (manual)

# Manual trigger only - same reasoning as load-test.yml: this run takes
# 1-15 minutes depending on level (0-4), registers 2-420 real accounts, performs
# real file uploads, and exercises every backend service at once. Not
# something every push/PR should pay for.
on:
  workflow_dispatch:
    inputs:
      auth_base_url:
        description: 'auth-user-service base URL'
        required: false
        default: 'http://localhost:3001'
      marketplace_base_url:
        description: 'marketplace-service base URL'
        required: false
        default: 'http://localhost:3002'
      ingestion_base_url:
        description: 'ingestion-service base URL'
        required: false
        default: 'http://localhost:3003'
      admin_base_url:
        description: 'admin-service base URL'
        required: false
        default: 'http://localhost:3004'
      level:
        description: 'Load level: 0 = smoke (1 buyer/1 dealer/2 rows/3 images); 1 = 50 buyers/3 dealers/15 rows; 2 = +60 images each; 3 = 200/10/50 rows/200 images; 4 = 400/20/150 rows/600 images'
        required: true
        default: '0'
        type: choice
        options: ['0', '1', '2', '3', '4']

jobs:
  end-to-end-load:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install k6
        uses: grafana/setup-k6-action@v1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            auth-user-service/package-lock.json
            marketplace-service/package-lock.json
            ingestion-service/package-lock.json
            admin-service/package-lock.json

      - name: Start Postgres
        run: docker compose up -d postgres

      - name: Wait for Postgres
        run: |
          for i in $(seq 1 30); do
            if docker exec vehicle_marketplace_postgres \
                 pg_isready -U marketplace -d vehicle_marketplace; then exit 0; fi
            sleep 2
          done
          echo "Postgres did not become ready" >&2
          exit 1

      - name: Prepare database
        working-directory: database
        run: |
          npm ci
          npm run migration:run
          npm run grants
          npm run seed:dictionaries
          npm run seed:vehicles
          npm run seed:admin
        env:
          DATABASE_URL: postgresql://marketplace:marketplace@localhost:5433/vehicle_marketplace
          ADMIN_SEED_EMAIL: ${{ vars.ADMIN_SEED_EMAIL }}
          ADMIN_SEED_NAME: 'CI Admin'
          ADMIN_SEED_PASSWORD: ${{ secrets.ADMIN_SEED_PASSWORD }}

      - name: Install and build auth-user-service
        working-directory: auth-user-service
        run: npm ci && npm run build

      - name: Install and build marketplace-service
        working-directory: marketplace-service
        run: npm ci && npm run build

      - name: Install and build ingestion-service
        working-directory: ingestion-service
        run: npm ci && npm run build

      - name: Install and build admin-service
        working-directory: admin-service
        run: npm ci && npm run build

      # All four services run as plain Node processes (their Dockerfiles
      # build Lambda-handler images, not runnable via `docker run -p`),
      # started + waited-on + used inside ONE step so none is at risk of
      # being reaped at a GitHub Actions step boundary.
      # Levels 2-4 upload a CSV+ZIP pair per dealer. registration_number is
      # globally unique, so the pairs are generated fresh for every run.
      - name: Generate dealer CSV+ZIP fixtures
        if: ${{ inputs.level != '1' }}
        run: bash performance/tools/generate-e2e-fixtures.sh ${{ inputs.level }}

      - name: Run k6 end-to-end load test against all four live services
        run: |
          set -e

          (
            cd auth-user-service
            PORT=3001 \
            AUTH_DATABASE_URL="postgresql://auth_service_role:dev_auth@localhost:5433/vehicle_marketplace" \
            DATABASE_SSL=false \
            AUTH_RETURN_VERIFICATION_TOKEN=true \
            JWT_ACCESS_SECRET=ci-load-test-secret-not-used-for-real-auth \
            JWT_ISSUER=autovault-lk-auth \
            JWT_AUDIENCE=autovault-lk-api \
            JWT_ACCESS_EXPIRES_IN=15m \
            INTERNAL_SERVICE_KEY=ci-load-test-internal-key-not-a-real-secret \
            node dist/main &
          )
          AUTH_PID=$!

          (
            cd marketplace-service
            PORT=3002 \
            MARKETPLACE_DATABASE_URL="postgresql://marketplace_service_role:dev_marketplace@localhost:5433/vehicle_marketplace" \
            DATABASE_SSL=false \
            JWT_ACCESS_SECRET=ci-load-test-secret-not-used-for-real-auth \
            JWT_ISSUER=autovault-lk-auth \
            JWT_AUDIENCE=autovault-lk-api \
            node dist/main &
          )
          MARKETPLACE_PID=$!

          (
            cd ingestion-service
            PORT=3003 \
            INGESTION_DATABASE_URL="postgresql://ingestion_service_role:dev_ingestion@localhost:5433/vehicle_marketplace" \
            DATABASE_SSL=false \
            JWT_ACCESS_SECRET=ci-load-test-secret-not-used-for-real-auth \
            JWT_ISSUER=autovault-lk-auth \
            JWT_AUDIENCE=autovault-lk-api \
            node dist/src/main &
          )
          INGESTION_PID=$!

          (
            cd admin-service
            PORT=3004 \
            ADMIN_DATABASE_URL="postgresql://admin_service_role:dev_admin@localhost:5433/vehicle_marketplace" \
            DATABASE_SSL=false \
            JWT_ACCESS_SECRET=ci-load-test-secret-not-used-for-real-auth \
            JWT_ISSUER=autovault-lk-auth \
            JWT_AUDIENCE=autovault-lk-api \
            INTERNAL_SERVICE_KEY=ci-load-test-internal-key-not-a-real-secret \
            AUTH_INTERNAL_URL=http://localhost:3001 \
            node dist/main &
          )
          ADMIN_PID=$!

          trap 'kill $AUTH_PID $MARKETPLACE_PID $INGESTION_PID $ADMIN_PID 2>/dev/null || true' EXIT

          for i in $(seq 1 30); do
            if curl -sf http://localhost:3001/health > /dev/null && \
               curl -sf http://localhost:3002/health > /dev/null && \
               curl -sf http://localhost:3003/health > /dev/null && \
               curl -sf http://localhost:3004/health > /dev/null; then break; fi
            if [ "$i" -eq 30 ]; then
              echo "services did not become ready" >&2
              exit 1
            fi
            sleep 2
          done

          AUTH_BASE_URL="${{ inputs.auth_base_url }}" \
          MARKETPLACE_BASE_URL="${{ inputs.marketplace_base_url }}" \
          INGESTION_BASE_URL="${{ inputs.ingestion_base_url }}" \
          ADMIN_BASE_URL="${{ inputs.admin_base_url }}" \
          ADMIN_SEED_EMAIL="${{ vars.ADMIN_SEED_EMAIL }}" \
          ADMIN_SEED_PASSWORD="${{ secrets.ADMIN_SEED_PASSWORD }}" \
          LEVEL="${{ inputs.level }}" \
          k6 run performance/scripts/end-to-end-load.js
