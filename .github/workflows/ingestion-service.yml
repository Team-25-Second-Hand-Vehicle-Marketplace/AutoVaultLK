name: Ingestion Service CI

on:
  push:
    paths:
      - 'ingestion-service/**'
      - 'marketplace-service/src/shared/normalize-embed/**'
      - '.github/workflows/ingestion-service.yml'
  pull_request:
    paths:
      - 'ingestion-service/**'
      - 'marketplace-service/src/shared/normalize-embed/**'
      - '.github/workflows/ingestion-service.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      DB_HOST: localhost
      DB_PORT: 5433
      DB_NAME: vehicle_marketplace
      DB_OWNER_USER: marketplace
      DB_OWNER_PASSWORD: marketplace
      DB_INGESTION_USER: ingestion_service_role
      DB_INGESTION_PASSWORD: dev_ingestion
      DATABASE_URL: postgresql://marketplace:marketplace@localhost:5433/vehicle_marketplace
      INGESTION_DATABASE_URL: postgresql://ingestion_service_role:dev_ingestion@localhost:5433/vehicle_marketplace

    defaults:
      run:
        working-directory: ingestion-service

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ingestion-service/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test:ci

      - name: Run e2e tests
        run: npm run test:e2e

      - name: Start Postgres
        run: docker compose up -d postgres
        working-directory: .

      - name: Wait for Postgres
        run: |
          for i in $(seq 1 30); do
            if docker exec vehicle_marketplace_postgres \
                 pg_isready -U marketplace -d vehicle_marketplace; then exit 0; fi
            sleep 2
          done
          echo "Postgres did not become ready" >&2
          exit 1

      - name: Install marketplace-service dependencies
        working-directory: marketplace-service
        run: npm ci

      - name: Prepare database
        working-directory: database
        run: |
          npm ci
          npm run migration:run
          npm run grants
          npm run seed:dictionaries
          npm run seed:vehicles

      - name: Run integration tests
        run: npm run test:integration

      - name: Build service
        run: npm run build

      - name: Build Docker image
        run: docker build --tag ingestion-service:ci .
