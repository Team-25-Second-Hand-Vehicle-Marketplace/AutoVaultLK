name: Ingestion Service CI

on:
  push:
    paths:
      - 'ingestion-service/**'
      # Drift guard: ingestion keeps a byte-identical copy of this directory
      # (test/unit/shared/normalize-embed-parity.spec.ts). Editing the
      # marketplace copy must re-run ingestion's suite, or the guard never
      # fires in the direction drift is most likely to come from.
      - 'marketplace-service/src/shared/normalize-embed/**'
      - '.github/workflows/ingestion-service.yml'
  pull_request:
    paths:
      - 'ingestion-service/**'
      # Drift guard: ingestion keeps a byte-identical copy of this directory
      # (test/unit/shared/normalize-embed-parity.spec.ts). Editing the
      # marketplace copy must re-run ingestion's suite, or the guard never
      # fires in the direction drift is most likely to come from.
      - 'marketplace-service/src/shared/normalize-embed/**'
      - '.github/workflows/ingestion-service.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ingestion-service

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ingestion-service/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test:ci

      - name: Run e2e tests
        run: npm run test:e2e

      # Integration tests need a real Postgres: they assert that the partial
      # index ON CONFLICT target actually matches, that pgvector accepts the
      # ::vector cast, and that trg_vehicles_search_vector fires. Unit tests
      # assert on the SQL string and cannot see any of that.
      #
      # The suite skips itself when no database is reachable, so a developer
      # without Docker gets a green local build; here the service container
      # opts in explicitly.
      - name: Start Postgres
        run: docker compose up -d postgres
        working-directory: .

      - name: Wait for Postgres
        run: |
          for i in $(seq 1 30); do
            if docker exec vehicle_marketplace_postgres \
                 pg_isready -U marketplace -d vehicle_marketplace; then exit 0; fi
            sleep 2
          done
          echo "Postgres did not become ready" >&2
          exit 1

      # seed:vehicles is what creates the DEALER users the integration suite
      # needs an owner from; there is no separate user seed.
      #
      # DATABASE_URL is set explicitly because .env is gitignored and does not
      # exist on a runner: data-source.ts and every seed read it, so without
      # this the migrations fail and the integration step then skips silently
      # because nothing is reachable. Port 5433 matches docker-compose, which
      # maps the container's 5432 to avoid a native Postgres on the host.
      - name: Prepare database
        working-directory: database
        env:
          DATABASE_URL: postgresql://marketplace:marketplace@127.0.0.1:5433/vehicle_marketplace
        run: |
          npm ci
          npm run migration:run
          npm run grants
          npm run seed:dictionaries
          npm run seed:vehicles

      # Two URLs, deliberately different roles. The suite connects as
      # ingestion_service_role so it exercises the real ADR-002 grants — one of
      # its assertions is that the role CANNOT delete from marketplace.vehicles
      # — and cleans up as the owner, which is the only role that can.
      - name: Run integration tests
        env:
          INGESTION_DATABASE_URL: postgresql://ingestion_service_role:dev_ingestion@127.0.0.1:5433/vehicle_marketplace
          DATABASE_URL: postgresql://marketplace:marketplace@127.0.0.1:5433/vehicle_marketplace
        run: npm run test:integration

      - name: Build service
        run: npm run build

      # The default Dockerfile targets the ingest API, whose handler is Dev B's
      # (B1) and does not exist yet — so this image builds but cannot cold
      # start. Every ETL stage handler does exist; those are packaged
      # separately per docker/etl-zip-lambdas.Dockerfile and
      # docker/embed.Dockerfile.
      - name: Build Docker image
        run: docker build --tag ingestion-service:ci .
