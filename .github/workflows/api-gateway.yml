name: API Gateway CI

on:
  push:
    paths:
      - 'api-gateway/**'
      - 'docker-compose.dev.yml'
      - '.github/workflows/api-gateway.yml'
  pull_request:
    paths:
      - 'api-gateway/**'
      - 'docker-compose.dev.yml'
      - '.github/workflows/api-gateway.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api-gateway

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api-gateway/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run OpenAPI and nginx alignment tests
        run: npm run test:ci

      - name: Validate nginx configuration syntax
        run: node scripts/validate-nginx.js
