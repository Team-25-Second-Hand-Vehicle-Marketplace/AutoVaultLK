name: Load Test - Large ZIP Upload Stress (manual)

# Manual trigger only - same reasoning as load-test.yml. Uploads a ~245MB
# ZIP (near the real 250MB maxZipSize cap) and a ~260MB ZIP (deliberately
# over it) directly to ingestion-service. See 04-load-testing.md Incidents
# 5.14-5.16 for why this test took three attempts to get right locally:
# the fixture's ZIP entry filenames must match the paired CSV's real
# registration numbers (--from-csv), or every image runs the full 30s
# unmatched-retry budget serially instead of reaching PROCESS_IMAGES.
on:
  workflow_dispatch:
    inputs:
      auth_base_url:
        description: 'auth-user-service base URL'
        required: false
        default: 'http://localhost:3001'
      ingestion_base_url:
        description: 'ingestion-service base URL'
        required: false
        default: 'http://localhost:3003'
      admin_base_url:
        description: 'admin-service base URL'
        required: false
        default: 'http://localhost:3004'

jobs:
  large-zip-stress-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install k6
        uses: grafana/setup-k6-action@v1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            auth-user-service/package-lock.json
            ingestion-service/package-lock.json
            admin-service/package-lock.json

      - name: Start Postgres
        run: docker compose up -d postgres

      - name: Wait for Postgres
        run: |
          for i in $(seq 1 30); do
            if docker exec vehicle_marketplace_postgres \
                 pg_isready -U marketplace -d vehicle_marketplace; then exit 0; fi
            sleep 2
          done
          echo "Postgres did not become ready" >&2
          exit 1

      - name: Prepare database
        working-directory: database
        run: |
          npm ci
          npm run migration:run
          npm run grants
          npm run seed:dictionaries
          npm run seed:vehicles
          npm run seed:admin
        env:
          DATABASE_URL: postgresql://marketplace:marketplace@localhost:5433/vehicle_marketplace
          ADMIN_SEED_EMAIL: ${{ vars.ADMIN_SEED_EMAIL }}
          ADMIN_SEED_NAME: 'CI Admin'
          ADMIN_SEED_PASSWORD: ${{ secrets.ADMIN_SEED_PASSWORD }}

      - name: Install and build auth-user-service
        working-directory: auth-user-service
        run: npm ci && npm run build

      - name: Install and build ingestion-service
        working-directory: ingestion-service
        run: npm ci && npm run build

      - name: Install and build admin-service
        working-directory: admin-service
        run: npm ci && npm run build

      # --from-csv makes ZIP entry filenames match the CSV's real
      # registration numbers (see Incident 5.15) - required for the job to
      # actually reach PROCESS_IMAGES instead of exhausting the unmatched-
      # retry budget.
      - name: Generate large-ZIP fixtures
        working-directory: ingestion-service
        run: |
          npx tsx src/tools/vehicle-generator/vehicle-generator.ts --count 50 --format csv --mode clean --output test-data/k6-stress2-raw-50.csv
          npx tsx src/tools/vehicle-generator/generate-unique-csv.ts --input test-data/k6-stress2-raw-50.csv --output test-data/k6-stress2-50.csv --prefix K6STRESS2
          npx tsx src/tools/vehicle-generator/generate-oversized-zip.ts --from-csv test-data/k6-stress2-50.csv --target-mb 245 --output test-data/k6-stress2-245mb.zip
          npx tsx src/tools/vehicle-generator/generate-oversized-zip.ts --from-csv test-data/k6-stress2-50.csv --target-mb 260 --output test-data/k6-stress2-260mb-overcap.zip

      - name: Run k6 large-ZIP stress test against live services
        run: |
          set -e

          (
            cd auth-user-service
            PORT=3001 \
            AUTH_DATABASE_URL="postgresql://auth_service_role:dev_auth@localhost:5433/vehicle_marketplace" \
            DATABASE_SSL=false \
            AUTH_RETURN_VERIFICATION_TOKEN=true \
            JWT_ACCESS_SECRET=ci-load-test-secret-not-used-for-real-auth \
            JWT_ISSUER=autovault-lk-auth \
            JWT_AUDIENCE=autovault-lk-api \
            JWT_ACCESS_EXPIRES_IN=15m \
            INTERNAL_SERVICE_KEY=ci-load-test-internal-key-not-a-real-secret \
            node dist/main &
          )
          AUTH_PID=$!

          (
            cd ingestion-service
            PORT=3003 \
            INGESTION_DATABASE_URL="postgresql://ingestion_service_role:dev_ingestion@localhost:5433/vehicle_marketplace" \
            DATABASE_SSL=false \
            JWT_ACCESS_SECRET=ci-load-test-secret-not-used-for-real-auth \
            JWT_ISSUER=autovault-lk-auth \
            JWT_AUDIENCE=autovault-lk-api \
            IMAGE_PROCESSING_TIMEOUT_MS=15000 \
            node dist/src/main &
          )
          INGESTION_PID=$!

          (
            cd admin-service
            PORT=3004 \
            ADMIN_DATABASE_URL="postgresql://admin_service_role:dev_admin@localhost:5433/vehicle_marketplace" \
            DATABASE_SSL=false \
            JWT_ACCESS_SECRET=ci-load-test-secret-not-used-for-real-auth \
            JWT_ISSUER=autovault-lk-auth \
            JWT_AUDIENCE=autovault-lk-api \
            INTERNAL_SERVICE_KEY=ci-load-test-internal-key-not-a-real-secret \
            AUTH_INTERNAL_URL=http://localhost:3001 \
            node dist/main &
          )
          ADMIN_PID=$!

          trap 'kill $AUTH_PID $INGESTION_PID $ADMIN_PID 2>/dev/null || true' EXIT

          for i in $(seq 1 30); do
            if curl -sf http://localhost:3001/health > /dev/null && \
               curl -sf http://localhost:3003/health > /dev/null && \
               curl -sf http://localhost:3004/health > /dev/null; then break; fi
            if [ "$i" -eq 30 ]; then
              echo "services did not become ready" >&2
              exit 1
            fi
            sleep 2
          done

          AUTH_BASE_URL="${{ inputs.auth_base_url }}" \
          INGESTION_BASE_URL="${{ inputs.ingestion_base_url }}" \
          ADMIN_BASE_URL="${{ inputs.admin_base_url }}" \
          ADMIN_SEED_EMAIL="${{ vars.ADMIN_SEED_EMAIL }}" \
          ADMIN_SEED_PASSWORD="${{ secrets.ADMIN_SEED_PASSWORD }}" \
          k6 run performance/scripts/large-zip-upload-stress.js
