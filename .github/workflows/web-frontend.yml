name: Web Frontend CI

on:
  push:
    paths:
      - 'web-frontend/**'
      - '.github/workflows/web-frontend.yml'
  pull_request:
    paths:
      - 'web-frontend/**'
      - '.github/workflows/web-frontend.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Type-check and build
        run: npm run build
