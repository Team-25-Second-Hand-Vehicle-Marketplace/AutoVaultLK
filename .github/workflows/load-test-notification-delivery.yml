name: Load Test - Notification Delivery (manual)

# Manual trigger only - same reasoning as load-test.yml. 15 concurrent VUs
# each send one uniquely-keyed notification event plus a deliberately
# shared idempotency key, to verify FR-53's "never send twice" guarantee
# holds under real concurrency (04-load-testing.md section 4.5g). SES is
# not exercised - SES_FROM_EMAIL is left empty, so delivery is logged
# locally rather than attempted for real, same as the local run.
on:
  workflow_dispatch:
    inputs:
      auth_base_url:
        description: 'auth-user-service base URL'
        required: false
        default: 'http://localhost:3001'
      notification_base_url:
        description: 'notification-service base URL'
        required: false
        default: 'http://localhost:3005'
      num_buyers:
        description: 'Number of concurrent buyers/VUs'
        required: false
        default: '15'

jobs:
  notification-delivery-load-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install k6
        uses: grafana/setup-k6-action@v1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            auth-user-service/package-lock.json
            notification-service/package-lock.json

      - name: Start Postgres
        run: docker compose up -d postgres

      - name: Wait for Postgres
        run: |
          for i in $(seq 1 30); do
            if docker exec vehicle_marketplace_postgres \
                 pg_isready -U marketplace -d vehicle_marketplace; then exit 0; fi
            sleep 2
          done
          echo "Postgres did not become ready" >&2
          exit 1

      - name: Prepare database
        working-directory: database
        run: |
          npm ci
          npm run migration:run
          npm run grants
        env:
          DATABASE_URL: postgresql://marketplace:marketplace@localhost:5433/vehicle_marketplace

      - name: Install and build auth-user-service
        working-directory: auth-user-service
        run: npm ci && npm run build

      - name: Install and build notification-service
        working-directory: notification-service
        run: npm ci && npm run build

      - name: Run k6 notification delivery test against live services
        run: |
          set -e

          INTERNAL_KEY="ci-load-test-internal-key-not-a-real-secret"

          (
            cd auth-user-service
            PORT=3001 \
            AUTH_DATABASE_URL="postgresql://auth_service_role:dev_auth@localhost:5433/vehicle_marketplace" \
            DATABASE_SSL=false \
            AUTH_RETURN_VERIFICATION_TOKEN=true \
            JWT_ACCESS_SECRET=ci-load-test-secret-not-used-for-real-auth \
            JWT_ISSUER=autovault-lk-auth \
            JWT_AUDIENCE=autovault-lk-api \
            JWT_ACCESS_EXPIRES_IN=15m \
            INTERNAL_SERVICE_KEY="$INTERNAL_KEY" \
            node dist/main &
          )
          AUTH_PID=$!

          (
            cd notification-service
            PORT=3005 \
            NOTIFICATION_DATABASE_URL="postgresql://notification_service_role:dev_notification@localhost:5433/vehicle_marketplace" \
            DATABASE_SSL=false \
            INTERNAL_SERVICE_KEY="$INTERNAL_KEY" \
            SES_FROM_EMAIL="" \
            node dist/main &
          )
          NOTIFICATION_PID=$!

          trap 'kill $AUTH_PID $NOTIFICATION_PID 2>/dev/null || true' EXIT

          for i in $(seq 1 30); do
            if curl -sf http://localhost:3001/health > /dev/null && \
               curl -sf http://localhost:3005/health > /dev/null; then break; fi
            if [ "$i" -eq 30 ]; then
              echo "services did not become ready" >&2
              exit 1
            fi
            sleep 2
          done

          AUTH_BASE_URL="${{ inputs.auth_base_url }}" \
          NOTIFICATION_BASE_URL="${{ inputs.notification_base_url }}" \
          NUM_BUYERS="${{ inputs.num_buyers }}" \
          INTERNAL_SERVICE_KEY="$INTERNAL_KEY" \
          k6 run performance/scripts/notification-delivery-load.js
