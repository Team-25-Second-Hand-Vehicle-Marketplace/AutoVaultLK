services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: vehicle_marketplace_postgres
    ports:
      # Host 5433 -> container 5432. Port 5432 on the host is taken by a
      # native PostgreSQL 18 install (service postgresql-x64-18), which
      # would otherwise intercept every connection before Docker.
      - "5433:5432"
    environment:
      POSTGRES_USER: marketplace
      POSTGRES_PASSWORD: marketplace
      POSTGRES_DB: vehicle_marketplace
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/docker/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marketplace -d vehicle_marketplace"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
