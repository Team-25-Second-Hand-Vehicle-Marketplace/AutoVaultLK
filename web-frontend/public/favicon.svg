  <path
    d="M7 3.5h10a2.6 2.6 0 0 1 2.6 2.6v5.6c0 5.6-3.6 8.2-7.6 8.9-4-.7-7.6-3.3-7.6-8.9V6.1A2.6 2.6 0 0 1 7 3.5z"
    fill="#0a1a36"
    stroke="#ffffff"
    stroke-width="1.7"
    stroke-linejoin="round"
  />
  <path
    d="M6 15.6v-2.4c0-.4.1-.7.4-1l1.8-2A1.6 1.6 0 0 1 9.4 9.6h5.2c.5 0 .9.2 1.2.6l1.8 2c.3.3.4.6.4 1v2.4"
    stroke="#ffffff"
