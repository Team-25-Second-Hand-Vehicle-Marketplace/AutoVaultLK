  />
  <circle cx="9.1" cy="15.9" r="1.5" fill="#0a1a36" stroke="#ffffff" stroke-width="1.4" />
  <circle cx="14.9" cy="15.9" r="1.5" fill="#0a1a36" stroke="#ffffff" stroke-width="1.4" />
</svg>
